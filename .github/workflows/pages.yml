name: Pubblica I FIORI della SIMO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Verifica file app
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f app.js
          test -f styles.css

      - name: Controlla JavaScript
        run: |
          node --check app.js
          node --check catalogo.js
          node --check catalogo-extra.js
          node --check identifica.js
          node --check sw.js

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara file del sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Pubblica sito
        id: deployment
        uses: actions/deploy-pages@v4
