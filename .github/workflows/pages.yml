name: Pubblica I FIORI della SIMO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Genera le icone della mascotte
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/generate-icons.py

      - name: Salva icone aggiornate nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png
          git add icons/icon-192-v041.png icons/icon-512-v041.png icons/apple-touch-icon-v041.png
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna icone Fiori di Simo per Android e iPhone"
            git push || echo "Impossibile salvare le icone sul branch; il sito pubblicato include comunque quelle aggiornate"
          fi

      - name: Verifica file app
        run: |
          test -f index.html
          test -f manifest.webmanifest
          test -f app.js
          test -f styles.css

      - name: Controlla JavaScript
        run: |
          node --check app.js
          node --check catalogo.js
          node --check catalogo-extra.js
          node --check identifica.js
          node --check sw.js

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara file del sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Pubblica sito
        id: deployment
        uses: actions/deploy-pages@v4
